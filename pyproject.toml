[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aeos"
version = "28.0.0"
description = "The AI Engineering OS — a working, model-agnostic operating system for agentic engineering (orchestration, context, memory, skills, governance, evaluation, observability, harness, entropy, learning, discovery)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "AEOS Project" }]
keywords = ["agents", "orchestration", "context-engineering", "evaluation", "autonomy"]
dependencies = []  # zero runtime dependencies by design (ADR-002)

[project.scripts]
aeos = "aeos.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
