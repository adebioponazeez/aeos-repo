.timeline { background:var(--card); border:1px solid var(--line); border-radius:8px;

.ev { display:flex; gap:10px; padding:2px 0; }
.ev .k { color:var(--accent); min-width:170px; }
footer { margin-top:40px; color:#8b949e; font-size:12px; }
